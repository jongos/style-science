<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Science README Masthead</title>
<style>
@font-face { font-family: Inter; src: url('../site/fonts/InterVariable.woff2'); font-weight: 100 900; }
* { box-sizing: border-box; letter-spacing: 0; }
body { margin: 0; background: #ece9df; color: #20211d; font-family: Inter, sans-serif; }
main { padding: 36px 44px 32px; }
header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #b4b1a6; padding-bottom: 24px; }
.brand { font-size: 24px; font-weight: 650; }
.edition { font-size: 12px; }
h1 { font-size: 76px; line-height: 1.06; font-weight: 580; margin: 48px 0 42px; }
h1 span { color: #ac301b; }
footer { display: flex; justify-content: space-between; gap: 24px; border-top: 1px solid #b4b1a6; padding-top: 22px; font-size: 15px; line-height: 1.5; }
footer strong { font-weight: 550; }
@media (max-width: 600px) {
  main { padding: 24px; }
  header { padding-bottom: 20px; }
  .brand { font-size: 21px; }
  .edition { font-size: 11px; max-width: 80px; text-align: right; }
  h1 { font-size: 42px; margin: 38px 0 34px; line-height: 1.12; }
  footer { flex-direction: column; gap: 8px; font-size: 14px; }
}
</style>
</head>
<body><main>
<header><span class="brand">Style Science</span><span class="edition">An Open Investigation</span></header>
<h1>Design Deserves<br><span>Better Questions.</span></h1>
<footer><strong>Style is a language.<br>Make its decisions legible.</strong><span>Design reasoning for AI,<br>agents and automated systems.</span></footer>
</main></body>
</html>

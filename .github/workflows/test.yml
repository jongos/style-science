name: GDC conformance
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: python --version
      - run: npm test
      - run: python tools/build_knowledge_graph.py
      - run: git diff --exit-code knowledge/graph.json
      - run: python tools/build_package.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.63.0 axe-core@4.13.0
      - run: npx playwright install --with-deps chromium
      - run: node --test browser.test.mjs
      - run: node tools/build_site.mjs
      - run: node tools/test_site.mjs

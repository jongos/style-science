name: Optional host-rendered validation
on:
  workflow_dispatch:
jobs:
  rendered:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Locate existing host Chrome
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome)) { throw 'Host Chrome unavailable; rendered validation not performed. No browser will be installed.' }
          "PLAYWRIGHT_EXECUTABLE_PATH=$chrome" >> $env:GITHUB_ENV
      - name: Install test libraries only
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.63.0 axe-core@4.13.0
      - run: npm run test:browser
      - run: npm run test:site
